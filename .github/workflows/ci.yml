# CI — MacroReborn
#
# APAGADA EN GITHUB desde el 09/10/2026 (specs/007-apagar-ci/spec.md).
# El repositorio es privado, y los minutos de Actions que pasan del cupo
# gratis se cobran a la cuenta valenmgg, su dueña. Se apagó en GitHub y
# no aquí: así no corre en ninguna rama, tampoco en las viejas que
# tienen este archivo. Mientras tanto, antes de unir a main, las pruebas
# y la prueba de humo se corren en el PC con Node 24 y 22 (regla XXII de
# la constitución). Para volver a encenderla, hablarlo antes con el
# equipo y después:
#   gh workflow enable CI -R valenmgg/MacroReborn
#
# Corre los tests automáticos en cada push y en cada pull request,
# sobre las versiones de Node que soporta el proyecto: la 24, la del
# servidor, y la 22, la mínima que se admite (jsdom pide la 22.13 o más).
# Cada versión termina aunque la otra falle (fail-fast: false): con el
# valor por defecto, un fallo en una cancelaba la otra, y la del servidor
# dejó de probarse entera. Por lo mismo, la prueba de humo corre con las
# dos.

name: CI

on:
  push:
  pull_request:

# Una subida nueva a una rama cancela la ejecución anterior de esa misma
# rama: se sube tras cada tarea, y solo importa la última. El repositorio
# es privado y Actions tiene un cupo de minutos al mes; con esto, octubre
# de 2026 habría gastado unos 940 en vez de 2.459.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: Smoke test HTTP local
        run: npm run test:smoke
