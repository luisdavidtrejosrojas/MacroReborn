# CI — MacroReborn
# Corre los tests automáticos en cada push y en cada pull request,
# sobre las versiones de Node que soporta el proyecto (20 y 22).
# Cada versión termina aunque la otra falle (fail-fast: false): con el
# valor por defecto, un fallo en una cancelaba la otra, y la del servidor,
# Node 20, dejó de probarse entera. Por lo mismo, la prueba de humo corre
# con las dos.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: Smoke test HTTP local
        run: npm run test:smoke
