<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Macro Snake</title>
  <desc id="desc">Portada arcade de MacroReborn con una serpiente pixelada y una fruta brillante.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17112b"/>
      <stop offset="1" stop-color="#35215e"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff9e"/>
      <stop offset="1" stop-color="#55d96b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <g opacity=".18" fill="#fff">
    <circle cx="120" cy="110" r="4"/><circle cx="260" cy="190" r="3"/><circle cx="1040" cy="120" r="5"/>
    <circle cx="960" cy="250" r="3"/><circle cx="180" cy="510" r="5"/><circle cx="1060" cy="520" r="4"/>
  </g>
  <text x="72" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffd75f" letter-spacing="5">MACROREBORN ORIGINAL</text>
  <text x="70" y="175" font-family="Arial, sans-serif" font-size="78" font-weight="900" fill="#fff">MACRO SNAKE</text>
  <text x="72" y="218" font-family="Arial, sans-serif" font-size="24" fill="#d9d2ea">Arcade · Récords · Progreso</text>

  <g transform="translate(600 355)" filter="url(#glow)">
    <circle r="180" fill="#0e1720" opacity=".55"/>
    <g fill="url(#snake)">
      <rect x="-22" y="-72" width="58" height="58" rx="12"/>
      <rect x="36" y="-72" width="58" height="58" rx="12"/>
      <rect x="94" y="-72" width="58" height="58" rx="12"/>
      <rect x="94" y="-14" width="58" height="58" rx="12"/>
      <rect x="36" y="44" width="58" height="58" rx="12"/>
      <rect x="-22" y="44" width="58" height="58" rx="12"/>
    </g>
    <g fill="#101820">
      <circle cx="18" cy="-48" r="7"/><circle cx="47" cy="-48" r="7"/>
    </g>
    <g fill="#ffd75f">
      <circle cx="-92" cy="-45" r="24"/>
      <circle cx="-108" cy="-70" r="6"/><circle cx="-77" cy="-70" r="6"/>
    </g>
  </g>

  <g transform="translate(72 585)">
    <rect width="315" height="48" rx="24" fill="#fff" opacity=".1"/>
    <text x="24" y="31" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">JUGÁ · SUPERÁ TU RÉCORD</text>
  </g>
</svg>
